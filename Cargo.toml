[package]
name = "nva2dlna"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Bridge Bilibili NVA casting sessions to a selected DLNA MediaRenderer"

[workspace]

[dependencies]
anyhow = "1.0.99"
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["json", "tokio"] }
bytes = "1.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.5.47", features = ["derive", "env"] }
futures-util = "0.3.34"
if-addrs = "0.13.4"
md5 = "0.8.0"
mdns-sd = "0.21.3"
reqwest = { version = "0.12.23", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
roxmltree = "0.20.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
socket2 = "0.6.5"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io", "rt"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
uuid = { version = "1.18.0", features = ["serde", "v4", "v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
